submission:
  title: "Fraud Detection System - AURA"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: > 
  With the rapid growth of UPI, mobile banking, internet banking, credit/debit cards, and online payments, customers perform millions of financial transactions digitally every day. This creates opportunities for fraudsters to carry out unauthorized transactions, account takeovers, identity theft, and unusual financial activities. Traditional security systems may not always detect suspicious transactions quickly, while excessive verification can create inconvenience for genuine customers.
  solution_summary: > 
  We built Aura, an AI-powered fraud detection system that analyzes transaction behavior, user patterns, device signals, and contextual risk factors in real time. It detects suspicious authorized transactions and provides timely, explainable warnings to help prevent financial fraud.

  key_features:              
  - "Real-time transaction monitoring and fraud detection"
  - "AI-based behavioral analysis to identify unusual user activity"
  - "Context-aware risk scoring using transaction, device, and beneficiary signals"
  - "Authorized fraud detection for scam-induced payments"
  - "Explainable alerts showing why a transaction is considered risky"

  tech_stack:
    languages: [ Python, SQL, HTML]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: [FastAPI, React.js]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: [watsonx.ai, IBM Bob]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: [PostgreSQL, Redis]                      # e.g., ["PostgreSQL", "Redis"]
    other: [Docker, Github Actions]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >
  We are proud of building **Aura**, a solution focused on detecting authorized fraud that traditional systems can easily miss. We are especially proud of our context-aware approach, which combines user behavior, transaction patterns, and risk signals to identify suspicious activity. Most importantly, Aura provides **clear and explainable alerts** that can help users make safer financial decisions.


  known_limitations: >        
  Aura is currently a prototype that relies mainly on simulated data, so its accuracy may differ from real-world banking environments. Fraud patterns constantly evolve, and the system may occasionally generate false alerts or miss new types of fraud. It also does not currently connect to real banking systems or process real transactions.


